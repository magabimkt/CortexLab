<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08121F">
<title>Córtex Lab</title>
<meta name="description" content="Espaço de estudo acadêmico de Psicologia com técnicas da neurociência.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Córtex Lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFF6;--surface:#FFFFFF;--surface2:#F1F5FA;--line:#CAD7E7;--text:#0D1B2E;--muted:#4E627C;
  --accent:#0A8597;--on-accent:#FFFFFF;--accent2:#4C5BD4;--ok:#0E8F63;--warn:#A86B12;--bad:#BF3A55;
  --c1:#0A8597;--c2:#4C5BD4;--c3:#1F74B8;--c4:#7A5BD0;--c5:#12907E;--c6:#5A7196;
  --grid:rgba(13,27,46,.045);
  --fh:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --fb:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08121F;--surface:#0F1C2E;--surface2:#142539;--line:#22385A;--text:#E2EBF6;--muted:#8DA1BB;
    --accent:#4FD3DE;--on-accent:#04202A;--accent2:#95A2FF;--ok:#5CDCA4;--warn:#EFC06A;--bad:#F07E95;
    --c1:#4FD3DE;--c2:#95A2FF;--c3:#5BB2F2;--c4:#B79CFF;--c5:#6EE7C8;--c6:#A9C4EC;--grid:rgba(120,170,230,.055);
  }
}
:root[data-theme="dark"]{
  --bg:#08121F;--surface:#0F1C2E;--surface2:#142539;--line:#22385A;--text:#E2EBF6;--muted:#8DA1BB;
  --accent:#4FD3DE;--on-accent:#04202A;--accent2:#95A2FF;--ok:#5CDCA4;--warn:#EFC06A;--bad:#F07E95;
  --c1:#4FD3DE;--c2:#95A2FF;--c3:#5BB2F2;--c4:#B79CFF;--c5:#6EE7C8;--c6:#A9C4EC;--grid:rgba(120,170,230,.055);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:var(--fb);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-family:var(--fh);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.brand svg{width:26px;height:26px}
.top .brand{white-space:nowrap;flex:none}
.disc{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}
button.disc{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;cursor:pointer;font-family:var(--fb)}
.discbtn{width:100%;appearance:none;cursor:pointer;font:inherit;color:inherit;text-align:left}
.discbtn[aria-current="true"]{border-color:var(--accent)}
.enun{margin-bottom:10px}
.edsec{margin:22px 0 10px}
.edsec h2{margin:0 0 6px}
.edsecd{border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin:8px 0 12px;background:var(--surface2)}
.edsecd>summary{cursor:pointer;font-weight:600}
.montar{margin-top:18px;border:1px solid var(--accent);border-radius:14px;padding:14px 16px;background:var(--surface)}
.montar h2{margin:0 0 4px}
.montar textarea{margin-top:10px;min-height:260px}
.enun p{margin:.35rem 0}
.pontes{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.pontes span{font-size:.74rem;padding:3px 9px;border-radius:99px;border:1px solid var(--mc,var(--accent));color:var(--text);background:color-mix(in srgb,var(--mc,var(--accent)) 12%,transparent)}
.hrow{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:.86rem}
.hrow .bar{height:12px}
.hrow b{font-family:var(--fh);text-align:right}
table.punnett{border-collapse:collapse;margin:.6rem auto;font-family:var(--fh);text-align:center}
.punnett th,.punnett td{border:1px solid var(--line);width:58px;height:44px;font-size:1.05rem}
.punnett th{background:var(--surface2);color:var(--mc,var(--accent))}
.punnett td.af{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;font-size:1.05rem;flex:none}

main{max-width:780px;margin:0 auto;padding:18px 16px 112px}

/* Barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 .68rem var(--fb);padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.tab .ic{font-size:1.25rem;line-height:1;filter:grayscale(.6);opacity:.85}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab[aria-current="page"] .ic{filter:none;opacity:1}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}

/* Tipografia */
h1,h2,h3{font-family:var(--fh);line-height:1.18;margin:0}
h1{font-size:1.8rem;font-weight:700;margin-bottom:.35rem}
h2{font-size:1.3rem;font-weight:600;margin:1.6rem 0 .7rem}
h3{font-size:1.06rem;font-weight:600}
p{margin:.5rem 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.lead{color:var(--muted);max-width:62ch;margin-top:0}

/* Blocos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-size:.95rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{height:6px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mc,var(--accent));border-radius:99px;transition:width .4s}
.m1{--mc:var(--c1)}.m2{--mc:var(--c2)}.m3{--mc:var(--c3)}.m4{--mc:var(--c4)}.m5{--mc:var(--c5)}.m6{--mc:var(--c6)}.m7{--mc:var(--c1)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}

/* Início */
.hero{position:relative;padding:18px 16px 8px;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.hero svg.map{display:block;width:100%;height:auto;margin-top:6px}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible circle:first-child{stroke:var(--accent)}
.nlabel{font:600 11px var(--fb);fill:var(--muted)}
.ctxt{font:700 20px var(--fh);fill:var(--text)}
.csub{font:500 9px var(--fb);fill:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--fh);font-size:1.25rem}
.stat span{font-size:.72rem;color:var(--muted);line-height:1.25;display:block}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today .panel{display:flex;flex-direction:column;gap:6px}
.today .big{font-family:var(--fh);font-size:2rem;font-weight:700;line-height:1}
.tech{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.tech div{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.tech div:first-child{border-top:0}
.tech .e{font-size:1.3rem}
.tech b{display:block;font-size:.95rem}
.tech span{font-size:.86rem;color:var(--muted)}

/* Trilha */
.modcard{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:12px;cursor:pointer;text-align:left;width:100%;appearance:none}
.modcard .e{font-size:1.8rem;text-align:center}
.modcard h3{margin-bottom:2px}
.modcard p{margin:0 0 8px;font-size:.86rem;color:var(--muted)}

/* Conceitos */
.back{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:.9rem;margin-bottom:10px}
.modhead{border-left:4px solid var(--mc);padding-left:12px;margin-bottom:16px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;position:relative}
.concept+.concept{margin-top:14px}
.concept.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.chead{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.chead .e{font-size:1.5rem;line-height:1.1}
.chead .num{margin-left:auto;font:600 .75rem var(--fh);color:var(--mc)}
.concept ul{padding-left:1.15rem;margin:.4rem 0}
.concept li{margin:.25rem 0}
.why{margin-top:12px;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.92rem}
.why b{color:var(--mc)}
.key{margin-top:10px;border-left:3px solid var(--mc);padding:8px 12px;background:color-mix(in srgb,var(--mc) 10%,transparent);border-radius:0 10px 10px 0;font-weight:500}
.cfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn.on{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:var(--ok);color:var(--ok);font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.5rem 0}
table.tb{border-collapse:collapse;width:100%;min-width:460px;font-size:.86rem}
.tb th,.tb td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tb th{background:var(--surface2);font-family:var(--fh);font-weight:600}
.flow{display:flex;flex-direction:column;gap:4px;margin:.5rem 0}
.flow span{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.88rem}
.flow i{font-style:normal;text-align:center;color:var(--mc);font-size:.8rem;line-height:1}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}

/* Seletores */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:10px 0 14px;-webkit-overflow-scrolling:touch}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.85rem;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}

/* Flashcards */
.fc{perspective:1200px;margin:6px 0 14px;cursor:pointer}
.fc-in{position:relative;min-height:270px;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--mc);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;overflow:auto}
.face.verso{transform:rotateY(180deg)}
.face .lbl{font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.face .q{font-family:var(--fh);font-size:1.3rem;font-weight:600;margin:auto 0;text-align:center;line-height:1.3}
.face .a{margin:auto 0;font-size:1rem}
.face .hint{text-align:center;font-size:.8rem;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;justify-content:center;gap:2px;padding:10px 6px;font-size:.82rem;text-align:center}
.rate .btn b{font-size:1.3rem}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.boxes div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:.72rem;color:var(--muted)}
.boxes b{display:block;font-family:var(--fh);font-size:1.1rem;color:var(--text)}

/* Quiz */
.qtext{font-size:1.08rem;font-weight:500;margin:6px 0 12px}
.opt{appearance:none;display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:.95rem;line-height:1.45}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default}
.exp{border-left:3px solid var(--accent);background:var(--surface2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.92rem;margin-top:6px}
.score{font-family:var(--fh);font-size:3rem;font-weight:700;line-height:1}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.portao{position:fixed;inset:0;z-index:100;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.portao[hidden]{display:none}
.portao-in{width:100%;max-width:420px}
.portao-marca{font-size:1.5rem;margin-bottom:18px}
.portao .panel{padding:20px 18px}
.portao h1{font-size:1.5rem;margin-bottom:.4rem}
.campo{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:1rem}
.campo:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn.full{width:100%;justify-content:center}
.divisor{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.82rem;margin:14px 0}
.divisor::before,.divisor::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:.88rem;text-decoration:underline}
.msg{font-size:.88rem;border-radius:10px;padding:9px 12px;margin-top:12px}
.msg.erro{background:color-mix(in srgb,var(--bad) 14%,transparent);border:1px solid var(--bad)}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid var(--ok)}
.pessoa{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.pessoa:first-child{border-top:0;padding-top:0}
.pessoa .quem{min-width:0;overflow-wrap:anywhere}
.reforco .item{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.reforco .item:first-of-type{border-top:0;padding-top:2px}
.reforco .ie{font-size:1.5rem;text-align:center;line-height:1.2}
.reforco .motivos{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;margin:0 0 4px;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}

/* Estudo dirigido */
details.ed{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.ed summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:30px 1fr 24px;gap:8px;align-items:start}
details.ed summary::-webkit-details-marker{display:none}
details.ed summary .n{font:700 .9rem var(--fh);color:var(--accent);padding-top:1px}
details.ed summary .st{text-align:right}
details.ed[open] summary{border-bottom:1px solid var(--line)}
.edbody{padding:12px 14px 14px}
textarea{width:100%;min-height:130px;resize:vertical;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:.95rem;line-height:1.5}
.modelo{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2)}
.modelo h3{font-size:.95rem;margin-bottom:4px}
.check{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:.92rem;cursor:pointer}
.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--ok);flex:none}

/* Foco */
.timer{text-align:center;padding:22px 16px}
.timer svg{width:230px;height:230px;display:block;margin:0 auto}
.tnum{font:700 46px var(--fh);fill:var(--text)}
.tmode{font:500 13px var(--fb);fill:var(--muted)}
ol.rit{padding-left:1.2rem;margin:.4rem 0}
ol.rit li{margin:.35rem 0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:640px){
  h1{font-size:2.2rem}
  .tab{font-size:.75rem}
}
@media (max-width:380px){
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand" aria-label="Córtex Lab">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="5" fill="var(--accent)"/>
        <circle cx="5" cy="7" r="2.6" fill="var(--c2)"/><circle cx="27" cy="7" r="2.6" fill="var(--c4)"/>
        <circle cx="5" cy="25" r="2.6" fill="var(--c3)"/><circle cx="27" cy="25" r="2.6" fill="var(--c1)"/>
        <path d="M7 8.5 12.5 13M25 8.5 19.5 13M7 23.5 12.5 19M25 23.5 19.5 19" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Córtex Lab
    </div>
    <button class="disc" id="discName" data-act="trocar" aria-label="Trocar disciplina"></button>
    <button class="iconbtn" data-act="tema" aria-label="Alternar tema claro ou escuro" title="Tema">🌓</button>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<nav class="tabs" aria-label="Navegação principal">
  <div class="tabs-in">
    <button class="tab" data-act="go" data-v="home"><span class="ic">🏠</span>Início</button>

<script src="firebase-config.js"></script>
<script>
/* Conteúdo protegido: chega criptografado e só é aberto após a liberação do acesso */
let DATA=null;

/* =========================================================
   ESTADO E ARMAZENAMENTO
   ========================================================= */
const KEY='cortexlab:v1';
let STORE={};
try{ STORE=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ STORE={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(STORE)); }catch(e){} }
/* Pede ao navegador para não apagar o progresso automaticamente */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
/* Sequência de dias de estudo */
function marcarDia(){ if(!STORE._dias||typeof STORE._dias!=='object') STORE._dias={}; STORE._dias[hoje()]=1; }
function sequenciaDias(){ const d=STORE._dias||{}; let n=0; const x=new Date(); if(!d[fmt(x)]) x.setDate(x.getDate()-1); while(d[fmt(x)]){ n++; x.setDate(x.getDate()-1); } return n; }
let disc=null;
function prepararDados(){
  DATA.disciplinas.forEach(d=>{
    d.modulos.forEach(m=>m.conceitos.forEach((c,i)=>{ c.id=m.id+'c'+(i+1); }));
    d.flashcards.forEach((c,i)=>{ c.id='f'+(i+1); });
    d.quiz.forEach((q,i)=>{ q.id='q'+(i+1); });
  });
  disc=DATA.disciplinas.find(d=>d.id===STORE._disc)||DATA.disciplinas[0];
}
function S(){
  if(!STORE[disc.id]) STORE[disc.id]={};
  const s=STORE[disc.id];
  ['conceitos','revelados','cards','quiz','resp','checks','abertas','qstat'].forEach(k=>{ if(!s[k]||typeof s[k]!=='object') s[k]={}; });
  if(typeof s.pomos!=='number') s.pomos=0;
  return s;
}

/* Datas */
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hoje(){ return fmt(new Date()); }
function maisDias(n){ const d=new Date(); d.setDate(d.getDate()+n); return fmt(d); }

/* Utilitários */
const $=s=>document.querySelector(s);
const app=$('#app');
function esc(t){ return String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function embaralhar(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function modPorId(id){ return disc.modulos.find(m=>m.id===id); }
function idxMod(id){ return disc.modulos.findIndex(m=>m.id===id); }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* Progresso */
function progModulo(m){ const s=S(); const n=m.conceitos.filter(c=>s.conceitos[c.id]).length; return m.conceitos.length?n/m.conceitos.length:0; }
function totalConceitos(){ return disc.modulos.reduce((a,m)=>a+m.conceitos.length,0); }
function conceitosFeitos(){ const s=S(); return disc.modulos.reduce((a,m)=>a+m.conceitos.filter(c=>s.conceitos[c.id]).length,0); }
function cardsDominados(){ const s=S(); return disc.flashcards.filter(c=>s.cards[c.id]&&s.cards[c.id].box>=3).length; }
function cardsPendentes(filtro){ const s=S(); const h=hoje(); return disc.flashcards.filter(c=>(filtro==='all'||c.m===filtro)&&(!s.cards[c.id]||s.cards[c.id].due<=h)); }
function quizMedia(){ const s=S(); const v=Object.values(s.quiz); if(!v.length) return 0; return v.reduce((a,b)=>a+b,0)/v.length; }
function estudoRespondidas(){ const s=S(); return disc.estudo.filter((e,i)=> e.o ? typeof s.resp[i]==='number' : String(s.resp[i]||'').trim().length>=30).length; }
function dominioGeral(){
  const a=conceitosFeitos()/totalConceitos();
  const b=cardsDominados()/disc.flashcards.length;
  const c=quizMedia();
  const d=estudoRespondidas()/disc.estudo.length;
  return (a+b+c+d)/4;
}
function dominioDe(d){ const prev=disc; disc=d; const v=dominioGeral(); disc=prev; return v; }
/* Sistema adaptativo: identifica onde você precisa fortalecer */
function questoesErradas(){ const s=S(); return disc.quiz.filter(q=>s.qstat[q.id]&&s.qstat[q.id].u===0); }
function cardsDificeis(mid){ const s=S(); return disc.flashcards.filter(f=>(!mid||f.m===mid)&&s.cards[f.id]&&(s.cards[f.id].box<=1||(s.cards[f.id].erros||0)>=2)); }
function analiseModulos(){
  const s=S();
  return disc.modulos.map((m,i)=>{
    let c=0,e=0,errAgora=0;
    disc.quiz.filter(q=>q.m===m.id).forEach(q=>{ const st=s.qstat[q.id]; if(st){ c+=st.c; e+=st.e; if(st.u===0) errAgora++; } });
    const cs=disc.flashcards.filter(f=>f.m===m.id);
    const vistos=cs.filter(f=>s.cards[f.id]).length;
    const dificeis=cardsDificeis(m.id).length;
    const caixa=cs.length?cs.reduce((a,f)=>a+((s.cards[f.id]&&s.cards[f.id].box)||0),0)/(cs.length*5):0;
    const conc=progModulo(m);
    const acc=(c+e)?c/(c+e):null;
    const dom=(acc===null?0:acc)*0.45+caixa*0.35+conc*0.2;
    const atividade=(c+e)+vistos+m.conceitos.filter(x=>s.conceitos[x.id]).length;
    return {m,i,c,e,acc,errAgora,dificeis,conc,dom,atividade};
  });
}
function painelReforco(){
  const an=analiseModulos();
  const ativos=an.filter(x=>x.atividade>0);
  const nErr=questoesErradas().length;
  if(!ativos.length) return `<div class="panel small muted">Comece pela Trilha e faça um quiz ou uma revisão de cards. A partir das suas respostas, o app vai mostrar aqui onde você precisa fortalecer.</div>`;
  const fracos=ativos.filter(x=>x.errAgora>0||x.dificeis>0||(x.acc!==null&&x.acc<0.7)).sort((a,b)=>a.dom-b.dom).slice(0,3);
  const nao=an.filter(x=>x.atividade===0);
  const itens=fracos.map(x=>{
    const mot=[];
    if(x.acc!==null) mot.push(`<span class="pill">✅ ${Math.round(x.acc*100)}% de acerto</span>`);
    if(x.errAgora) mot.push(`<span class="pill">❌ ${x.errAgora} ${x.errAgora>1?'questões':'questão'} para refazer</span>`);
    if(x.dificeis) mot.push(`<span class="pill">🃏 ${x.dificeis} ${x.dificeis>1?'cards difíceis':'card difícil'}</span>`);
    mot.push(`<span class="pill">📖 ${Math.round(x.conc*100)}% dos conceitos</span>`);
    return `<div class="item m${x.i+1}"><span class="ie">${x.m.e}</span><div><b>${esc(x.m.nome)}</b>
      <div class="motivos">${mot.join('')}</div>
      <div class="row">

}

function heroSVG(){
  const n=disc.modulos.length; const H=n===4?200:222; const cy=n===4?100:104;
  const pos = n===4 ? [[62,54],[278,54],[62,148],[278,148]] : disc.modulos.map((_,i)=>{ const ang=(-90+180/n+i*360/n)*Math.PI/180; return [Math.round(170+116*Math.cos(ang)), Math.round(cy+72*Math.sin(ang))]; });
  let lines='', nodes='';
  disc.modulos.forEach((m,i)=>{
    const p=progModulo(m); const [x,y]=pos[i]; const C=2*Math.PI*22; const cor='var(--c'+(i+1)+')';
    lines+=`<line x1="170" y1="${cy}" x2="${x}" y2="${y}" stroke="${cor}" stroke-width="2" stroke-opacity="${(0.2+p*0.8).toFixed(2)}" ${p>0?'':'stroke-dasharray="3 5"'}/>`;
    nodes+=`<g class="node" data-act="mod" data-v="${m.id}" tabindex="0" role="button" aria-label="Abrir módulo ${esc(m.nome)}, ${Math.round(p*100)}% compreendido">

      <text x="${x}" y="${y+38}" text-anchor="middle" class="nlabel">${esc(m.curto)} ${Math.round(p*100)}%</text></g>`;
  });
  const deco=[[118,30],[222,30],[118,172],[222,172],[20,100],[320,100],[170,24],[170,178]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2" fill="var(--muted)" opacity=".35"/>`).join('');
  const dom=Math.round(dominioGeral()*100);
  return `<svg class="map" viewBox="0 0 340 ${H}" role="img" aria-label="Mapa neural do seu progresso: domínio geral ${dom}%">
    ${deco}${lines}
    <circle cx="170" cy="${cy}" r="34" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="170" cy="${cy}" r="41" fill="none" stroke="var(--accent)" stroke-opacity=".25" stroke-width="1"/>

    <text x="170" y="${cy+17}" text-anchor="middle" class="csub">domínio</text>

}

const INTERVALOS=[0,1,2,4,8,16];

}
function iniciarCards(treino){

}

  const st=s.cards[c.id];

    </div>`:`<p class="small muted" style="text-align:center">Responda mentalmente antes de virar.</p>`}`;

function avaliar(nota){
  const s=S(); const id=CS.fila[CS.i]; const c=s.cards[id]||{box:0,vistos:0};
  let box=c.box||0;
  if(nota===0) box=1; else if(nota===1) box=Math.max(1,box); else box=Math.min(5,box+1);
  const dias = nota===0 ? 0 : Math.max(1,INTERVALOS[box]);
  s.cards[id]={box, due:maisDias(dias), vistos:(c.vistos||0)+1, erros:(c.erros||0)+(nota===0?1:0)};
  marcarDia(); save();
  if(nota===0) CS.fila.push(id);
  CS.i++; CS.virado=false; CS.feitos++;
  renderCards();
}

let QS={filtro:'all', qs:[], i:0, acertos:0, resp:null, modo:'normal', errosMod:{}};
/* Prioridade: errou da última vez > ainda não vista > acertou poucas vezes > já dominada */
function prioridadeQ(q){ const st=S().qstat[q.id]; if(!st) return 2; if(st.u===0) return 3; return st.e>st.c?2.5:1/(1+st.c); }
function iniciarQuiz(modo){
  QS.modo=modo||'normal';
  let base = QS.modo==='erros' ? questoesErradas() : disc.quiz.filter(q=>QS.filtro==='all'||q.m===QS.filtro);
  base = base.map(q=>({q, p:prioridadeQ(q)+Math.random()*1.2})).sort((a,b)=>b.p-a.p).map(x=>x.q);
  QS.qs=embaralhar(base.slice(0,10)).map(q=>{ const ordem=embaralhar(q.o.map((_,k)=>k)); return {q, ordem}; });
  QS.i=0; QS.acertos=0; QS.resp=null; QS.errosMod={};
}
function renderQuiz(){
  const s=S();
  if(!QS.qs.length){
    const nErr=questoesErradas().length;
    app.innerHTML=`<h1>✅ Quiz</h1>
      <p class="lead">Dez questões por rodada. O modo misturado intercala os módulos, o que exige mais esforço e gera aprendizagem mais duradoura.</p>
      ${chipsModulos(QS.filtro,'qfiltro','🔀 Misturado')}
      <div class="panel stack">
        <div class="small muted">Melhor resultado neste filtro: <b>${s.quiz[QS.filtro]!==undefined?Math.round(s.quiz[QS.filtro]*100)+'%':'ainda não feito'}</b></div>
        <div class="row"><button class="btn primary" data-act="qstart">Começar quiz</button>
        ${nErr?`<button class="btn" data-act="qerros">🎯 Refazer meus erros (${nErr})</button>`:''}</div>
        <p class="small muted" style="margin:0">🧠 Quiz adaptativo: as questões que você errou e as que ainda não viu aparecem com mais frequência.</p>
      </div>`;
    return;
  }
  if(QS.i>=QS.qs.length){
    const pct=QS.acertos/QS.qs.length;
    const ant=s.quiz[QS.filtro]||0;
    if(QS.modo!=='erros' && pct>ant){ s.quiz[QS.filtro]=pct; save(); }
    const msg = pct>=.8?'🚀 Excelente! Conteúdo bem consolidado.':pct>=.6?'👍 Bom caminho. Revise os cards dos erros.':'🔁 Volte à trilha nos pontos que errou e tente de novo amanhã.';
    app.innerHTML=`<h1>✅ Resultado</h1>
      <div class="panel stack" style="text-align:center">
        <div class="score">${QS.acertos}/${QS.qs.length}</div>
        <p>${msg}</p>
        ${Object.keys(QS.errosMod).length?`<div style="text-align:left"><b>Onde você errou nesta rodada:</b>${Object.entries(QS.errosMod).sort((a,b)=>b[1]-a[1]).map(([mid,n])=>{ const mo=modPorId(mid); return `<div class="row" style="flex-wrap:nowrap;align-items:center;margin-top:8px"><span style="flex:1">${mo.e} ${esc(mo.nome)} <span class="small muted">(${n} ${n>1?'erros':'erro'})</span></span><button class="btn sm" style="flex:none" data-act="mod" data-v="${mid}">📖 Rever</button></div>`; }).join('')}</div>`:''}
        <div class="row" style="justify-content:center"><button class="btn primary" data-act="qstart">Nova rodada</button><button class="btn" data-act="qsair">Trocar filtro</button></div>
      </div>`;
    return;
  }
  const item=QS.qs[QS.i]; const q=item.q; const m=modPorId(q.m);
  const respondido=QS.resp!==null;
  app.innerHTML=`<h1>✅ Quiz</h1>
    <div class="row small muted" style="justify-content:space-between"><span>Questão ${QS.i+1} de ${QS.qs.length} · ${m.e} ${esc(m.curto)}</span><span>${QS.acertos} acertos</span></div>
    <div class="bar" style="margin:8px 0 12px"><i style="width:${Math.round(QS.i/QS.qs.length*100)}%"></i></div>
    <p class="qtext">${esc(q.q)}</p>
    ${item.ordem.map(k=>{ let cls=''; if(respondido){ if(k===q.a) cls='correct'; else if(k===QS.resp) cls='wrong'; }
      return `<button class="opt ${cls}" data-act="qop" data-v="${k}" ${respondido?'disabled':''}>${esc(q.o[k])}</button>`; }).join('')}

  const ch=s.checks[i]||{}; const total=e.p.length; const ok=Object.values(ch).filter(Boolean).length;
  if(resp&&ok===total) return '✅';
  if(resp) return '✍️';
  return '⚪';
}

/* =========================================================
   FOCO (Pomodoro)
   ========================================================= */
const T={modo:'foco', dur:25*60, rest:25*60, rodando:false, id:null, fim:0};
function setModo(modo){
  T.modo=modo; T.dur=(modo==='foco'?25:5)*60; T.rest=T.dur; T.rodando=false; clearInterval(T.id);
  atualizaTimer();
}
function mmss(t){ return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function bip(){
  try{ const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC();
    [0,0.35,0.7].forEach(off=>{ const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,ctx.currentTime+off); g.gain.exponentialRampToValueAtTime(0.2,ctx.currentTime+off+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+off+0.25);
      o.start(ctx.currentTime+off); o.stop(ctx.currentTime+off+0.3); });
  }catch(e){}
}
function tick(){
  T.rest=Math.max(0,Math.round((T.fim-Date.now())/1000));
  if(T.rest<=0){
    clearInterval(T.id); T.rodando=false; bip();
    if(T.modo==='foco'){ S().pomos++; save(); toast('🎉 Bloco concluído! Antes da pausa, lembre 3 ideias sem olhar.'); setModo('pausa'); }
    else { toast('⏱️ Pausa encerrada. Pronta para outro bloco?'); setModo('foco'); }
    return;
  }
  atualizaTimer();
}
function atualizaTimer(){
  $('#focoLbl').textContent = T.rodando ? mmss(T.rest) : 'Foco';
  if(VIEW!=='foco') return;
  const C=2*Math.PI*96; const frac=T.rest/T.dur;
  const arc=document.getElementById('tarc'), num=document.getElementById('tnum'), md=document.getElementById('tmd'), bt=document.getElementById('tbtn');
  if(arc) arc.setAttribute('stroke-dasharray',(C*frac).toFixed(1)+' '+C.toFixed(1));
  if(num) num.textContent=mmss(T.rest);
  if(md) md.textContent=T.modo==='foco'?'bloco de foco':'pausa';
  if(bt) bt.textContent=T.rodando?'⏸ Pausar':'▶ Iniciar';
}
function renderFoco(){
  const C=2*Math.PI*96;
  app.innerHTML=`<h1>⏱️ Foco</h1>
    <p class="lead">25 minutos de estudo, 5 de pausa. Na pausa, levante, beba água e deixe o celular de lado.</p>
    <div class="panel timer">
      <div class="chips" style="justify-content:center;margin-top:0">
        <button class="chip" data-act="tmodo" data-v="foco" aria-pressed="${T.modo==='foco'}">🎯 Foco 25</button>
        <button class="chip" data-act="tmodo" data-v="pausa" aria-pressed="${T.modo==='pausa'}">☕ Pausa 5</button>
      </div>
      <svg viewBox="0 0 230 230" aria-hidden="true">
        <circle cx="115" cy="115" r="96" fill="none" stroke="var(--surface2)" stroke-width="10"/>
        <circle id="tarc" cx="115" cy="115" r="96" fill="none" stroke="${T.modo==='foco'?'var(--accent)':'var(--ok)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C} ${C}" transform="rotate(-90 115 115)"/>
        <text id="tnum" x="115" y="122" text-anchor="middle" class="tnum">${mmss(T.rest)}</text>
        <text id="tmd" x="115" y="148" text-anchor="middle" class="tmode">${T.modo==='foco'?'bloco de foco':'pausa'}</text>
      </svg>
      <div role="timer" aria-live="off" class="row" style="justify-content:center;margin-top:10px">
        <button class="btn primary" id="tbtn" data-act="tplay">${T.rodando?'⏸ Pausar':'▶ Iniciar'}</button>
        <button class="btn" data-act="treset">↺ Reiniciar</button>
      </div>
      <p class="small muted" style="margin-top:12px">Blocos concluídos nesta disciplina: <b>${S().pomos}</b></p>
    </div>
    <h2>🧭 Ritual de um bloco</h2>
    <div class="panel"><ol class="rit">
      <li><b>Antes:</b> escolha um único módulo ou uma questão do estudo dirigido.</li>
      <li><b>Durante:</b> leia um conceito, feche os olhos e explique em voz alta.</li>
      <li><b>No fim:</b> anote 3 ideias que lembra sem olhar.</li>
      <li><b>Depois da pausa:</b> faça os cards do mesmo módulo.</li>
    </ol></div>`;
  atualizaTimer();
}

/* =========================================================
   ACESSO RESTRITO
   O conteúdo chega criptografado. A chave fica no Firebase e só é
   entregue a emails liberados pela administradora.
   ========================================================= */
const PAYLOAD=JSON.parse(document.getElementById('conteudo').textContent);
const CHAVE_LOCAL='cortexlab:chave:'+PAYLOAD.v;
const ADMIN_EMAIL=String(window.CORTEX_ADMIN||'').trim().toLowerCase();
let USUARIO=null, ADMIN=false, APP_ABERTO=false, PORTAO_ESTADO='';

function b64bytes(s){ const bin=atob(String(s).trim()); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function decifrar(chave){
  const key=await crypto.subtle.importKey('raw',b64bytes(chave),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(PAYLOAD.iv)},key,b64bytes(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lerLocal(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
async function abrirCom(chave){
  let dados;
  try{ dados=await decifrar(chave); }catch(e){ return false; }
  try{ localStorage.setItem(CHAVE_LOCAL,String(chave).trim()); }catch(e){}
  if(!APP_ABERTO){ DATA=dados; prepararDados(); APP_ABERTO=true; go('home'); }
  fecharPortao();
  return true;
}
function esquecerChave(){ try{ Object.keys(localStorage).filter(k=>k.startsWith('cortexlab:chave:')).forEach(k=>localStorage.removeItem(k)); }catch(e){} }

    h=`<div class="panel"><h1 id="portaoTitulo">🔐 Verificando seu acesso…</h1><p class="muted" style="margin:0">Só um instante.</p></div>`;

    h=`<div class="panel">

        <input class="campo" id="pgSenha" type="password" autocomplete="current-password" placeholder="Senha (mínimo 6 caracteres)" aria-label="Senha">
        <div class="row"><button class="btn primary" data-act="pgEntrar">Entrar</button><button class="btn" data-act="pgCriar">Criar conta</button></div>
        <button class="linkbtn" data-act="pgEsqueci">Esqueci minha senha</button>
      </div>${msg}</div>`;
  } else if(estado==='verificar'){
    h=`<div class="panel">
      <h1 id="portaoTitulo">📧 Confirme seu email</h1>
      <p class="muted">Enviamos um link de confirmação para <b>${esc(USUARIO?USUARIO.email:'')}</b>. Abra o email, toque no link e depois volte aqui.</p>
      <div class="stack"><button class="btn primary full" data-act="pgConfirmei">Já confirmei</button>

  } else if(estado==='pendente'){
    h=`<div class="panel">
      <h1 id="portaoTitulo">⏳ Aguardando liberação</h1>
      <p class="muted">Seu pedido de acesso com <b>${esc(USUARIO?USUARIO.email:'')}</b> foi enviado para a administradora. Assim que ele for aprovado, toque em "Verificar novamente".</p>
      <div class="stack"><button class="btn primary full" data-act="pgVerificar">Verificar novamente</button>
      <button class="btn ghost full" data-act="pgSair">Usar outra conta</button></div>${msg}</div>`;
  } else if(estado==='semchave'){
    h=`<div class="panel">
      <h1 id="portaoTitulo">🔑 Configurar o conteúdo</h1>
      <p class="muted">Você é a administradora. Para liberar o conteúdo desta versão (<b>${esc(PAYLOAD.v)}</b>), cole abaixo a chave do arquivo <b>CHAVE-cortexlab-${esc(PAYLOAD.v)}.txt</b>. Isso só precisa ser feito uma vez por versão.</p>
      <div class="stack"><textarea class="campo" id="pgChave" rows="2" style="min-height:0" placeholder="Cole a chave aqui"></textarea>
      <button class="btn primary full" data-act="pgChave">Salvar chave e abrir</button>
      <button class="btn ghost full" data-act="pgSair">Sair</button></div>${msg}</div>`;
  } else {
    h=`<div class="panel">

      ${USUARIO?'<button class="btn ghost full" data-act="pgSair">Sair da conta</button>':''}</div>${msg}</div>`;

}
function msgPortao(texto,ok){ const corpo=$('#portaoCorpo .panel'); if(!corpo) return; let m=corpo.querySelector('.msg'); if(!m){ m=document.createElement('div'); corpo.appendChild(m); } m.className='msg '+(ok?'ok':'erro'); m.innerHTML=texto; }
function travar(el,sim){ if(el){ el.disabled=sim; } }

/* Chamado pelo módulo do Firebase sempre que o login muda */
window.CORTEX_AUTH=async function(u){
  USUARIO=u; ADMIN=!!(u&&ADMIN_EMAIL&&u.email===ADMIN_EMAIL);
  if(!u){
    if(APP_ABERTO){ esquecerChave(); location.reload(); return; }
    portao('entrar'); return;
  }
  if(!u.verificado){ if(!APP_ABERTO) portao('verificar'); return; }
  await conferirAcesso();
};
window.CORTEX_ERRO=function(tipo){
  if(APP_ABERTO) return;
  if(tipo==='config') portao('erro',{texto:'O login ainda não foi configurado. A administradora precisa preencher o arquivo <b>firebase-config.js</b> com os dados do projeto Firebase.'});
  else portao('erro',{texto:'Não foi possível carregar o sistema de login. Verifique sua internet e tente novamente.'});
};
async function conferirAcesso(){
  if(!APP_ABERTO) portao('carregando');
  const r=await window.FB.lerChave(PAYLOAD.v);
  if(r.chave){
    const ok=await abrirCom(r.chave);
    if(ok){ if(VIEW==='home') renderHome(); return; }
    if(ADMIN){ if(!APP_ABERTO) portao('semchave',{msg:'A chave salva no Firebase não abre esta versão. Cole a chave correta.'}); }
    else if(!APP_ABERTO) portao('erro',{texto:'O conteúdo está temporariamente indisponível. Avise a administradora.'});
    return;
  }
  if(r.inexistente){
    if(ADMIN){ if(!APP_ABERTO) portao('semchave'); }
    else if(!APP_ABERTO) portao('erro',{texto:'O conteúdo ainda não foi configurado pela administradora.'});
    return;
  }
  if(r.erro==='permission-denied'){
    if(APP_ABERTO){ esquecerChave(); location.reload(); return; }
    try{ await window.FB.pedirAcesso(USUARIO.nome||''); }catch(e){}
    portao('pendente'); return;
  }
  /* Sem internet ou falha temporária: se já estava aberto, continua funcionando */
  if(!APP_ABERTO) portao('erro',{texto:'Não foi possível conferir seu acesso agora. Verifique a internet e tente novamente.'});
}

/* Painel de acessos (somente administradora) */
function dataCurta(iso){ try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return ''; } }
function renderAcessos(){
  if(!ADMIN){ go('home'); return; }
  app.innerHTML=`<button class="back" data-act="go" data-v="home">← Início</button>
    <h1>🔐 Gerenciar acessos</h1>
    <p class="lead">Só quem estiver na lista de acesso consegue abrir o conteúdo. Quem tentar entrar sem estar na lista aparece em "Pedidos aguardando".</p>
    <h2>➕ Liberar um email</h2>
    <div class="panel stack">
      <input class="campo" id="acEmail" type="email" placeholder="email@exemplo.com" aria-label="Email a liberar">
      <input class="campo" id="acNome" placeholder="Nome (opcional)" aria-label="Nome">
      <button class="btn primary" data-act="acLiberar">Liberar acesso</button>
      <p class="small muted" style="margin:0">A pessoa entra com esse email pelo Google, ou cria uma conta com email e senha.</p>
    </div>
    <h2>⏳ Pedidos aguardando</h2>
    <div class="panel" id="acPedidos"><span class="muted small">Carregando…</span></div>
    <h2>✅ Pessoas com acesso</h2>
    <div class="panel" id="acPermitidos"><span class="muted small">Carregando…</span></div>
    <h2>🔑 Chave do conteúdo</h2>
    <div class="panel stack">
      <p class="small muted" style="margin:0">Versão atual do app: <b>${esc(PAYLOAD.v)}</b>. Use este campo só quando publicar uma nova versão do app, colando a chave que vem junto com ela.</p>
      <textarea class="campo" id="acChave" rows="2" style="min-height:0" placeholder="Cole a chave aqui"></textarea>
      <button class="btn" data-act="acChave">Salvar chave</button>
    </div>`;
  carregarListas();
}
async function carregarListas(){
  try{
    const [ped,per]=await Promise.all([window.FB.listar('pedidos'),window.FB.listar('permitidos')]);
    LISTAS={pedidos:ped,permitidos:per};
  }catch(e){ const a=$('#acPedidos'); if(a) a.innerHTML='<span class="small">Não foi possível carregar. Verifique a internet e as regras do Firestore.</span>'; return; }
  if(VIEW!=='acessos') return;
  const pp=LISTAS.pedidos.sort((a,b)=>String(b.quando||'').localeCompare(String(a.quando||'')));
  $('#acPedidos').innerHTML = pp.length ? pp.map(x=>`<div class="pessoa"><div class="quem"><b>${esc(x.nome||'Sem nome')}</b><div class="small muted">${esc(x.id)}${x.quando?' · '+dataCurta(x.quando):''}</div></div>
    <div class="row" style="flex:none"><button class="btn sm primary" data-act="acAprovar" data-v="${esc(x.id)}">Aprovar</button><button class="btn sm ghost" data-act="acRecusar" data-v="${esc(x.id)}">Recusar</button></div></div>`).join('')
    : '<span class="small muted">Nenhum pedido no momento.</span>';
  const pm=LISTAS.permitidos.sort((a,b)=>a.id.localeCompare(b.id));
  $('#acPermitidos').innerHTML = pm.length ? pm.map(x=>`<div class="pessoa"><div class="quem"><b>${esc(x.nome||'Sem nome')}</b><div class="small muted">${esc(x.id)}</div></div>
    <button class="btn sm ghost" style="flex:none" data-act="acRemover" data-v="${esc(x.id)}">Remover</button></div>`).join('')
    : '<span class="small muted">Ninguém liberado ainda (além de você, que é a administradora).</span>';
}
async function liberarEmail(email,nome){
  await window.FB.salvar('permitidos',email,{nome:nome||'',quando:new Date().toISOString()});
  try{ await window.FB.apagar('pedidos',email); }catch(e){}
}
const EMAIL_OK=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
Object.assign(ACOES,{
  pgGoogle:async(v,el)=>{ travar(el,true); try{ await window.FB.entrarGoogle(); }catch(e){ msgPortao(textoErro(e)); } travar(el,false); },
  pgEntrar:async(v,el)=>{ const em=($('#pgEmail').value||'').trim(), s=$('#pgSenha').value||''; travar(el,true); try{ await window.FB.entrarEmail(em,s); }catch(e){ msgPortao(textoErro(e)); } travar(el,false); },
  pgCriar:async(v,el)=>{ const em=($('#pgEmail').value||'').trim(), s=$('#pgSenha').value||''; if(!EMAIL_OK.test(em)){ msgPortao('Digite um email válido.'); return; } travar(el,true); try{ await window.FB.criarConta(em,s); }catch(e){ msgPortao(textoErro(e)); } travar(el,false); },
  pgEsqueci:async()=>{ const em=($('#pgEmail').value||'').trim(); if(!EMAIL_OK.test(em)){ msgPortao('Digite seu email no campo acima e toque de novo em "Esqueci minha senha".'); return; } try{ await window.FB.redefinir(em); msgPortao('Se houver uma conta com esse email, você vai receber um link para criar uma nova senha.',true); }catch(e){ msgPortao(textoErro(e)); } },
  pgConfirmei:async(v,el)=>{ travar(el,true); try{ const u=await window.FB.recarregar(); if(u&&u.verificado){ await window.CORTEX_AUTH(u); } else msgPortao('Ainda não identificamos a confirmação. Abra o link do email e tente de novo.'); }catch(e){ msgPortao(textoErro(e)); } travar(el,false); },
  pgReenviar:async()=>{ try{ await window.FB.reenviar(); msgPortao('Email reenviado. Confira também a caixa de spam.',true); }catch(e){ msgPortao(textoErro(e)); } },
  pgVerificar:async(v,el)=>{ travar(el,true); await conferirAcesso(); if(PORTAO_ESTADO==='pendente') msgPortao('Seu acesso ainda não foi liberado.'); },
  pgSair:async()=>{ if(!confirm('Sair da conta neste aparelho? Seu progresso de estudo continua salvo aqui.')) return; esquecerChave(); try{ await window.FB.sair(); }catch(e){} location.reload(); },
  pgRecarregar:()=>location.reload(),
  pgChave:async(v,el)=>{ const k=($('#pgChave').value||'').trim(); if(!k){ msgPortao('Cole a chave.'); return; } travar(el,true);
    let dados=null; try{ dados=await decifrar(k); }catch(e){}
    if(!dados){ msgPortao('Esta chave não abre esta versão do conteúdo. Confira se copiou a chave inteira, do arquivo da versão '+esc(PAYLOAD.v)+'.'); travar(el,false); return; }
    try{ await window.FB.salvar('chaves',PAYLOAD.v,{k}); }catch(e){ msgPortao('Não foi possível salvar no Firebase. Confira as regras do Firestore.'); travar(el,false); return; }
    await abrirCom(k); },
  acLiberar:async(v,el)=>{ const em=($('#acEmail').value||'').trim().toLowerCase(), nome=($('#acNome').value||'').trim(); if(!EMAIL_OK.test(em)){ toast('Digite um email válido'); return; } travar(el,true); try{ await liberarEmail(em,nome); toast('✅ Acesso liberado para '+em); $('#acEmail').value=''; $('#acNome').value=''; carregarListas(); }catch(e){ toast('Não foi possível liberar. Verifique a internet.'); } travar(el,false); },
  acAprovar:async(v,el)=>{ const p=LISTAS.pedidos.find(x=>x.id===v)||{}; travar(el,true); try{ await liberarEmail(v,p.nome||''); toast('✅ Acesso liberado para '+v); carregarListas(); }catch(e){ toast('Não foi possível aprovar.'); travar(el,false); } },
  acRecusar:async(v,el)=>{ if(!confirm('Recusar o pedido de '+v+'?')) return; travar(el,true); try{ await window.FB.apagar('pedidos',v); carregarListas(); }catch(e){ toast('Não foi possível recusar.'); travar(el,false); } },
  acRemover:async(v,el)=>{ if(!confirm('Remover o acesso de '+v+'? A pessoa perde o acesso na próxima vez que abrir o app com internet.')) return; travar(el,true); try{ await window.FB.apagar('permitidos',v); toast('Acesso removido'); carregarListas(); }catch(e){ toast('Não foi possível remover.'); travar(el,false); } },
  acChave:async(v,el)=>{ const k=($('#acChave').value||'').trim(); if(!k){ toast('Cole a chave'); return; }
    let dados=null; try{ dados=await decifrar(k); }catch(e){}
    if(!dados){ toast('Esta chave não abre a versão '+PAYLOAD.v); return; }
    travar(el,true); try{ await window.FB.salvar('chaves',PAYLOAD.v,{k}); toast('🔑 Chave salva'); $('#acChave').value=''; }catch(e){ toast('Não foi possível salvar.'); } travar(el,false); }
});

/* Aplicativo instalável e funcionamento sem internet */
function avisoNovaVersao(){
  if(document.getElementById('novaVersao')) return;
  const d=document.createElement('div'); d.id='novaVersao'; d.setAttribute('role','status');
  d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:200;display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--text);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100% - 32px);font-size:.9rem';
  d.innerHTML='<span style="white-space:nowrap">🔄 Versão nova disponível</span><button class="btn sm primary" type="button">Atualizar</button>';
  d.querySelector('button').addEventListener('click',()=>location.reload());
  document.body.appendChild(d);
}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(()=>{ SW_OK=true; if(VIEW==='home'&&DATA) renderHome(); }).catch(()=>{});
    navigator.serviceWorker.addEventListener('message',e=>{ if(e.data==='nova-versao') avisoNovaVersao(); });
  });
}
</script>
<script type="module">
/* Firebase: login (Google ou email e senha) e lista de acesso no Firestore */
const V='10.14.1';
try{
  const cfg=window.FIREBASE_CONFIG||{};
  if(!cfg.apiKey || /COLE/i.test(cfg.apiKey)){ window.CORTEX_ERRO&&window.CORTEX_ERRO('config'); }
  else{
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-lite.js`);
    const app=initializeApp(cfg);
    const auth=A.getAuth(app); auth.languageCode='pt';
    const db=F.getFirestore(app);
    const usuario=u=>u?{ email:(u.email||'').toLowerCase(), nome:u.displayName||'', verificado:!!u.emailVerified }:null;
    const meuEmail=()=>((auth.currentUser&&auth.currentUser.email)||'').toLowerCase();
    window.FB={
      async entrarGoogle(){
        const p=new A.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
        try{ await A.signInWithPopup(auth,p); }
        catch(e){ if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment') await A.signInWithRedirect(auth,p); else throw e; }
      },
      entrarEmail:(e,s)=>A.signInWithEmailAndPassword(auth,e,s),
      async criarConta(e,s){ const c=await A.createUserWithEmailAndPassword(auth,e,s); await A.sendEmailVerification(c.user); },
      reenviar:()=>A.sendEmailVerification(auth.currentUser),
      redefinir:(e)=>A.sendPasswordResetEmail(auth,e),
      async recarregar(){ await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); return usuario(auth.currentUser); },
      sair:()=>A.signOut(auth),
      async lerChave(v){
        try{ const s=await F.getDoc(F.doc(db,'chaves',v)); return s.exists()?{chave:s.data().k}:{inexistente:true}; }
        catch(e){ return {erro:e.code||'erro'}; }
      },
      pedirAcesso:(nome)=>F.setDoc(F.doc(db,'pedidos',meuEmail()),{nome:nome||'',email:meuEmail(),quando:new Date().toISOString()}),
      async listar(col){ const q=await F.getDocs(F.collection(db,col)); return q.docs.map(d=>({id:d.id,...d.data()})); },
      salvar:(col,id,dados)=>F.setDoc(F.doc(db,col,id),dados),
      apagar:(col,id)=>F.deleteDoc(F.doc(db,col,id))
    };
    A.getRedirectResult(auth).catch(()=>{});
    A.onAuthStateChanged(auth,u=>window.CORTEX_AUTH(usuario(u)));
  }
}catch(e){ window.CORTEX_ERRO&&window.CORTEX_ERRO('rede'); }
</script>
